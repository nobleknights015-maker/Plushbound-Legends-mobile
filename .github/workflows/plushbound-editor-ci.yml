name: Plushbound Visual Editor CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'tools/editor/**'
      - 'game/runtime/**'
      - 'game/content/**'
      - 'game/assets/asset-manifest.json'
      - 'game/tests/editor-core.test.js'
      - 'game/tests/encounter-session.test.js'
      - 'game/tests/common-event-core.test.js'
      - '.github/workflows/plushbound-editor-ci.yml'
  pull_request:
    paths:
      - 'tools/editor/**'
      - 'game/runtime/**'
      - 'game/content/**'
      - 'game/assets/asset-manifest.json'
      - 'game/tests/editor-core.test.js'
      - 'game/tests/encounter-session.test.js'
      - 'game/tests/common-event-core.test.js'
      - '.github/workflows/plushbound-editor-ci.yml'

jobs:
  editor-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out game development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run editor and runtime contracts
        run: |
          node --check tools/editor/editor-core.js
          node --check tools/editor/playtest.js
          node --check tools/editor/editor.js
          node --check tools/editor/common-event-core.js
          node --check tools/editor/common-event-map.js
          node --check tools/editor/common-events.js
          node --check game/runtime/GameContentRuntime.js
          node --check game/runtime/PlushboundGameSession.js
          node --test game/tests/editor-core.test.js game/tests/encounter-session.test.js game/tests/common-event-core.test.js

      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >editor-http.log 2>&1 &
          echo $! > editor-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/tools/editor/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat editor-http.log
          exit 1

      - name: Simulate Elyndor authoring and runtime playtest in Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          const errors = [];
          page.on('pageerror', err => errors.push(String(err)));
          await page.goto('http://127.0.0.1:4173/tools/editor/index.html');
          await page.click('#loadElyndor');
          await page.waitForFunction(() => document.querySelectorAll('.event-marker').length >= 4);

          assert.match(await page.textContent('#status'), /Sunny Plains of Elyndor/);
          assert.equal(await page.locator('#mapCanvas').evaluate(el => el.style.width), '896px');
          assert.equal(await page.locator('#mapCanvas').evaluate(el => el.style.height), '560px');
          assert.equal(await page.locator('.tile').count(), 640);
          assert.ok(await page.locator('.asset-card').count() > 5);
          assert.ok(await page.evaluate(() => window.PlushboundEditor.getAssets().some(a => a.id === 'npc/lio/sprite')));

          // Regression coverage: selecting an event must render page summaries without page errors.
          await page.click('[data-tool="select"]');
          await page.click('[data-event-id="lio"]');
          assert.ok(await page.locator('#eventPageSummary .page-row').count() >= 3);

          // Native tile layer painting with complete undo/redo.
          assert.equal(await page.locator('#layerSelect option').count(), 1);
          await page.fill('#tileId', '17');
          await page.click('[data-tool="tile"]');
          await page.locator('.tile[data-x="4"][data-y="5"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[0].data[5*32+4]), 17);
          assert.ok((await page.evaluate(() => window.PlushboundEditor.getHistory().undo)) > 0);
          await page.click('#undoEdit');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[0].data[5*32+4]), 0);
          await page.click('#redoEdit');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[0].data[5*32+4]), 17);
          await page.click('[data-tool="erase-tile"]');
          await page.locator('.tile[data-x="4"][data-y="5"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[0].data[5*32+4]), 0);

          await page.click('#addLayer');
          await page.fill('#layerZ', '10');
          await page.uncheck('#layerVisible');
          await page.click('#applyLayer');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[1].z), 10);
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[1].visible), false);

          // Native Engine v1 region painting and encounter preview.
          await page.fill('#regionId', '9');
          await page.click('[data-tool="region"]');
          await page.locator('.tile[data-x="8"][data-y="8"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].regions[8*32+8]), 9);
          assert.equal(await page.locator('.tile[data-x="8"][data-y="8"] .region-id').textContent(), 'R9');
          assert.match(await page.textContent('#encounterPreview'), /elyndor-sunny-plains-early/);

          // Existing event movement and asset assignment preserve page data.
          await page.click('[data-tool="select"]');
          await page.click('[data-event-id="lio"]');
          const beforePages = await page.evaluate(() => JSON.stringify(window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'lio').pages));
          await page.fill('#eventX', '20');
          await page.fill('#eventY', '11');
          await page.selectOption('#eventAsset', 'npc/lio/sprite');
          await page.click('#applyEvent');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'lio').assetId), 'npc/lio/sprite');
          assert.equal(await page.evaluate(() => JSON.stringify(window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'lio').pages)), beforePages);

          // Asset browser assignment.
          await page.fill('#assetSearch', 'chest');
          await page.locator('[data-asset-id="environment/chest/elyndor-small"]').click();
          assert.equal(await page.inputValue('#eventAsset'), 'environment/chest/elyndor-small');

          // Place a brand-new authored NPC with an editable page and command.
          await page.fill('#newEventId', 'editor-browser-npc');
          await page.click('#armNewEvent');
          await page.locator('.tile[data-x="6"][data-y="6"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.inputValue('#eventId'), 'editor-browser-npc');
          await page.selectOption('#pageTrigger', 'touch');
          await page.fill('#pageConditions', '{"switchId":"editor:browser-test","switchValue":true}');
          await page.click('#applyPage');
          await page.selectOption('#newCommandType', 'MESSAGE');
          await page.fill('#newCommandParameters', '["Hello from the visual editor"]');
          await page.click('#addCommand');
          const authored = await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'editor-browser-npc').pages[0]);
          assert.equal(authored.trigger, 'touch');
          assert.equal(authored.commands[0].parameters[0], 'Hello from the visual editor');

          // Reusable common-event insertion preserves the current map/page and normal undo history.
          await page.selectOption('#mapSelect', 'elyndor-sunthread-crossing');
          await page.click('[data-event-id="anchor-west"]');
          const commonOriginalCount = await page.evaluate(() => window.PlushboundEditor.getPackage().maps.find(m => m.id === 'elyndor-sunthread-crossing').events.find(e => e.id === 'anchor-west').pages[0].commands.length);
          const historyBeforeCommon = await page.evaluate(() => window.PlushboundEditor.getHistory().undo);
          await page.evaluate(() => window.PlushboundCommonEventMap.setLibrary({schemaVersion:1,commonEvents:[{id:'ci-reusable',name:'CI Reusable',commands:[{code:'MESSAGE',parameters:['Reusable hello']},{code:'WAIT',parameters:[0.1]}]}]}));
          await page.click('#insertCommonEvent');
          assert.equal(await page.inputValue('#mapSelect'), 'elyndor-sunthread-crossing');
          assert.equal(await page.inputValue('#eventId'), 'anchor-west');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps.find(m => m.id === 'elyndor-sunthread-crossing').events.find(e => e.id === 'anchor-west').pages[0].commands.length), commonOriginalCount + 2);
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getHistory().undo), historyBeforeCommon + 2);
          await page.click('#undoEdit');
          await page.click('#undoEdit');
          assert.equal(await page.inputValue('#mapSelect'), 'elyndor-sunthread-crossing');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps.find(m => m.id === 'elyndor-sunthread-crossing').events.find(e => e.id === 'anchor-west').pages[0].commands.length), commonOriginalCount);
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getHistory().undo), historyBeforeCommon);

          // Return to the first map for transfer and runtime checks.
          await page.selectOption('#mapSelect', 'elyndor-sunny-plains');

          // Create and validate a native cross-map transfer.
          await page.fill('#transferEventId', 'editor-to-crossing');
          await page.selectOption('#transferTargetMap', 'elyndor-sunthread-crossing');
          await page.fill('#transferX', '2');
          await page.fill('#transferY', '12');
          await page.selectOption('#transferDirection', '6');
          await page.click('#armTransfer');
          await page.locator('.tile[data-x="30"][data-y="10"]').click({ position: { x: 2, y: 2 } });
          const transfer = await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'editor-to-crossing'));
          assert.equal(transfer.pages[0].trigger, 'touch');
          assert.deepEqual(transfer.pages[0].commands[0].parameters, ['elyndor-sunthread-crossing',2,12,6]);
          assert.deepEqual(await page.evaluate(() => window.PlushboundEditor.validateLinks()), []);

          // Whole-package validation has no hard errors for the normalized project.
          const validation = await page.evaluate(() => window.PlushboundEditor.validate());
          assert.equal(validation.filter(issue => issue.severity === 'error').length, 0);

          // Collision painting remains compatible with all authoring layers.
          await page.click('[data-tool="blocked"]');
          await page.locator('.tile[data-x="4"][data-y="4"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].blocked.includes('4,4')), true);

          // In-editor playtest runs the actual PlushboundGameSession path.
          assert.equal(await page.evaluate(() => window.PlushboundEditor.startPlaytest({x:12,y:10,encounter:{base:999,variance:0,rate:1}})), true);
          await page.waitForFunction(() => !document.querySelector('#playtestOverlay').hidden);
          let preview = await page.evaluate(() => window.PlushboundEditor.getPlaytestSnapshot());
          assert.equal(preview.currentMap, 'elyndor-sunny-plains');
          assert.equal(preview.map.x, 12);
          assert.equal(preview.map.y, 10);
          const step = await page.evaluate(() => window.PlushboundEditor.playtestMove(1,0));
          assert.equal(step.moved, true);
          preview = await page.evaluate(() => window.PlushboundEditor.getPlaytestSnapshot());
          assert.equal(preview.map.x, 13);
          assert.match(await page.textContent('#playtestStatus'), /Sunny Plains of Elyndor/);
          await page.evaluate(() => window.PlushboundEditor.stopPlaytest());
          assert.equal(await page.locator('#playtestOverlay').evaluate(el => el.hidden), true);

          assert.deepEqual(errors, []);
          await browser.close();
          console.log('Plushbound editor authoring + runtime playtest simulation passed');
          NODE

      - name: Record editor simulation gate
        if: always()
        run: |
          cat > plushbound-editor-gate.txt <<EOF
          Plushbound Visual Editor simulation
          Browser: Chromium headless
          Target package: Elyndor runtime maps
          Coverage: tile layers, regions, encounters, collision, assets, event placement/pages/full commands, reusable common-event insertion + history, transfers, undo/redo, validation, real-session playtest
          Result: ${{ job.status }}
          Commit: ${{ github.sha }}
          EOF

      - name: Upload editor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-editor-ci
          path: |
            plushbound-editor-gate.txt
            editor-http.log
          if-no-files-found: warn
