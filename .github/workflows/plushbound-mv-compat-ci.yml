name: Plushbound MV Compatibility CI

on:
  push:
    branches: [plushbound-game-development]
    paths:
      - 'tools/editor/mv-project-core.js'
      - 'tools/editor/mv-database-contracts.js'
      - 'tools/editor/mv-shell-contracts.js'
      - 'tools/editor/mv-editor-adapter.js'
      - 'tools/editor/mv-file-import.js'
      - 'tools/editor/mv-zip.js'
      - 'tools/editor/mv-browser-integration.js'
      - 'tools/editor/editor-deeplinks.js'
      - 'game/tests/mv-project-core.test.js'
      - 'game/tests/mv-database-contracts.test.js'
      - 'game/tests/mv-shell-contracts.test.js'
      - 'game/tests/mv-editor-adapter.test.js'
      - 'game/tests/mv-file-import.test.js'
      - 'game/tests/mv-zip.test.js'
      - '.github/workflows/plushbound-mv-compat-ci.yml'
  workflow_dispatch:

jobs:
  mv-project-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check MV compatibility modules
        run: |
          node --check tools/editor/mv-project-core.js
          node --check tools/editor/mv-database-contracts.js
          node --check tools/editor/mv-shell-contracts.js
          node --check tools/editor/mv-editor-adapter.js
          node --check tools/editor/mv-file-import.js
          node --check tools/editor/mv-zip.js
          node --check tools/editor/mv-browser-integration.js
      - name: Test all MV compatibility contracts
        run: node --test game/tests/mv-project-core.test.js game/tests/mv-database-contracts.test.js game/tests/mv-shell-contracts.test.js game/tests/mv-editor-adapter.test.js game/tests/mv-file-import.test.js game/tests/mv-zip.test.js
      - name: Guard frozen Engine v1
        run: test -z "$(git diff --name-only c0b2e9eae707fd1ac66fc23c6ca362cf0a946e5c...HEAD -- engine/)"
