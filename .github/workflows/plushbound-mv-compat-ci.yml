name: Plushbound MV Compatibility CI

on:
  push:
    branches: [plushbound-game-development]
    paths:
      - 'tools/editor/mv-project-core.js'
      - 'game/tests/mv-project-core.test.js'
      - '.github/workflows/plushbound-mv-compat-ci.yml'
  workflow_dispatch:

jobs:
  mv-project-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check MV compatibility core
        run: node --check tools/editor/mv-project-core.js
      - name: Test MV project data contracts
        run: node --test game/tests/mv-project-core.test.js
      - name: Guard frozen Engine v1
        run: test -z "$(git diff --name-only c0b2e9eae707fd1ac66fc23c6ca362cf0a946e5c...HEAD -- engine/)"
