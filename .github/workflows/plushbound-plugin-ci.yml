name: Plushbound MV Plugin Compatibility CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'game/runtime/MVPluginRuntime.js'
      - 'game/runtime/AndroidGameBootstrap.js'
      - 'game/plugins/**'
      - 'game/tests/mv-plugin-runtime.test.js'
      - 'game/tests/plugin-manager-core.test.js'
      - 'tools/editor/plugin-manager*'
      - 'tools/editor/command-form-core.js'
      - '.github/workflows/plushbound-plugin-ci.yml'
  pull_request:
    paths:
      - 'game/runtime/MVPluginRuntime.js'
      - 'game/runtime/AndroidGameBootstrap.js'
      - 'game/plugins/**'
      - 'game/tests/mv-plugin-runtime.test.js'
      - 'game/tests/plugin-manager-core.test.js'
      - 'tools/editor/plugin-manager*'
      - 'tools/editor/command-form-core.js'
      - '.github/workflows/plushbound-plugin-ci.yml'

jobs:
  mv-plugin-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate plugin compatibility source
        run: |
          set -euo pipefail
          node --check game/runtime/MVPluginRuntime.js
          node --check tools/editor/plugin-manager-core.js
          node --check tools/editor/plugin-manager.js
          node --check tools/editor/command-form-core.js
          node -e "const m=require('./game/plugins/plugins.json'); if(m.schemaVersion!==1||!Array.isArray(m.plugins)||!String(m.target).includes('RPG Maker MV')) process.exit(1)"
      - name: Run MV plugin compatibility contracts
        run: |
          node --test game/tests/mv-plugin-runtime.test.js game/tests/plugin-manager-core.test.js game/tests/command-form-core.test.js
      - name: Assert first-class editor and runtime surfaces
        run: |
          grep -q 'PluginManager' game/runtime/MVPluginRuntime.js
          grep -q 'Game_Interpreter' game/runtime/MVPluginRuntime.js
          grep -q 'PLUGIN_COMMAND' tools/editor/command-form-core.js
          grep -q 'Plushbound Plugin Manager' tools/editor/plugin-manager.html
