name: Plushbound Character Atlas v1 CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'tools/editor/character-atlas-v1-core.js'
      - 'tools/editor/character-atlas-v1.js'
      - 'tools/editor/character-atlas-v1.html'
      - 'tools/editor/character-atlas-v1-builder-core.js'
      - 'tools/editor/character-atlas-v1-builder.js'
      - 'tools/editor/character-atlas-v1-builder.html'
      - 'tools/editor/editor-deeplinks.js'
      - 'game/assets/ASSET_COMPATIBILITY_V1.json'
      - 'engine/src/render/CharacterSpriteRenderer.js'
      - 'engine/src/assets/AssetCompatibilityV1.js'
      - 'game/tests/character-atlas-v1-core.test.js'
      - 'game/tests/character-atlas-v1-builder-core.test.js'
      - 'engine/tests/asset_compatibility_v1.test.js'
      - '.github/workflows/plushbound-character-atlas-v1-ci.yml'
  pull_request:
    paths:
      - 'tools/editor/character-atlas-v1-core.js'
      - 'tools/editor/character-atlas-v1.js'
      - 'tools/editor/character-atlas-v1.html'
      - 'tools/editor/character-atlas-v1-builder-core.js'
      - 'tools/editor/character-atlas-v1-builder.js'
      - 'tools/editor/character-atlas-v1-builder.html'
      - 'tools/editor/editor-deeplinks.js'
      - 'game/assets/ASSET_COMPATIBILITY_V1.json'
      - 'engine/src/render/CharacterSpriteRenderer.js'
      - 'engine/src/assets/AssetCompatibilityV1.js'
      - 'game/tests/character-atlas-v1-core.test.js'
      - 'game/tests/character-atlas-v1-builder-core.test.js'
      - 'engine/tests/asset_compatibility_v1.test.js'
      - '.github/workflows/plushbound-character-atlas-v1-ci.yml'

jobs:
  atlas-v1-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate atlas compiler, builder and engine compatibility syntax
        run: |
          node --check tools/editor/character-atlas-v1-core.js
          node --check tools/editor/character-atlas-v1.js
          node --check tools/editor/character-atlas-v1-builder-core.js
          node --check tools/editor/character-atlas-v1-builder.js
          node --check tools/editor/editor-deeplinks.js
          node --check engine/src/render/CharacterSpriteRenderer.js
          node --check engine/src/assets/AssetCompatibilityV1.js
      - name: Prove locked coordinates, runtime extraction and deterministic building
        run: node --test game/tests/character-atlas-v1-core.test.js game/tests/character-atlas-v1-builder-core.test.js game/tests/editor-core.test.js
      - name: Prove Character Atlas output remains Engine v1 compatible
        run: node --test engine/tests/asset_compatibility_v1.test.js
      - name: Character Atlas v1 asset-production checkpoint
        run: echo "Character Atlas v1 authoring and Engine v1 runtime extraction contracts agree"
