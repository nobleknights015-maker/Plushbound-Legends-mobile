name: Plushbound Engine v1 CI

on:
  push:
    branches: [ engine-v1-rebuild, plushbound-game-development ]
    paths:
      - 'engine/**'
      - 'game/assets/ASSET_COMPATIBILITY_V1.json'
      - 'tools/editor/mv-editor-adapter.js'
      - 'tools/editor/mv-event-command-adapter.js'
      - 'tools/editor/mv-tile-id-contracts.js'
      - 'tools/editor/mv-autotile-composition.js'
      - 'tools/editor/character-atlas-v1-core.js'
      - '.github/workflows/engine-v1-ci.yml'
  workflow_dispatch:

jobs:
  engine-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine/editor integration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate engine source syntax
        run: |
          find engine/src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tools/editor/mv-editor-adapter.js
          node --check tools/editor/mv-event-command-adapter.js
          node --check tools/editor/mv-tile-id-contracts.js
          node --check tools/editor/mv-autotile-composition.js

      - name: Run executable engine tests
        working-directory: engine
        run: npm test

      - name: Verify World Editor to Engine v1 contract
        run: node --test engine/tests/world_editor_project_adapter.test.js

      - name: Verify asset production compatibility contract
        run: node --test engine/tests/asset_compatibility_v1.test.js game/tests/asset-compatibility-v1.test.js

      - name: Verify required engine modules
        run: |
          test -f engine/src/core/EngineKernel.js
          test -f engine/src/core/GameState.js
          test -f engine/src/events/EventInterpreter.js
          test -f engine/src/editor/WorldEditorProjectAdapter.js
          test -f engine/src/assets/AssetCompatibilityV1.js
          test -f engine/src/render/MvTilesetResolver.js
          test -f game/assets/ASSET_COMPATIBILITY_V1.json
          test -f docs/ENGINE_V1_SPEC.md
          test -f docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md

      - name: Verify compatibility foundations are declared
        run: |
          grep -qi "map" docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md
          grep -qi "event" docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md
          grep -qi "battle" docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md
          grep -qi "save" docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md
          grep -qi "audio" docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md
          grep -qi "touch" docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md
          grep -qi "vertical" docs/MV_FUNCTIONAL_COMPATIBILITY_MATRIX.md

      - name: Engine v1 editor and asset compatibility checkpoint
        run: echo "Engine v1, World Editor and Asset Compatibility V1 validation passed"
