name: Plushbound Engine v1 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ engine-v1-rebuild ]
    paths:
      - 'engine/**'
      - 'source_chunks/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/engine-v1-android-apk.yml'

jobs:
  build-engine-v1-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine rebuild
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Engine v1 tests
        working-directory: engine
        run: npm test

      - name: Run final release acceptance gate explicitly
        working-directory: engine
        run: node --test tests/final_acceptance_gate.test.js

      - name: Record tested release-gate commit
        run: |
          cat > engine-v1-release-gate.json <<JSON
          {
            "engine": "Plushbound Engine v1",
            "branch": "engine-v1-rebuild",
            "commit": "${GITHUB_SHA}",
            "acceptanceTest": "engine/tests/final_acceptance_gate.test.js",
            "status": "passed"
          }
          JSON
          python -m json.tool engine-v1-release-gate.json >/dev/null

      - name: Reconstruct clean Android project source
        run: |
          cat source_chunks/part_* > project-source.b64
          base64 -d project-source.b64 > project-source-fixed.zip
          unzip -o project-source-fixed.zip -d .

      - name: Package Engine v1 modules into Android assets
        run: |
          rm -rf app/src/main/assets/engine-v1
          mkdir -p app/src/main/assets/engine-v1
          cp -R engine/src/. app/src/main/assets/engine-v1/
          cp engine-v1-release-gate.json app/src/main/assets/engine-v1/release-gate.json
          cat > app/src/main/assets/engine-v1/package-manifest.json <<'JSON'
          {
            "engine": "Plushbound Engine v1",
            "branch": "engine-v1-rebuild",
            "entrypoints": {
              "kernel": "core/EngineKernel.js",
              "androidHost": "platform/AndroidHostBridge.js",
              "webViewRuntime": "runtime/BrowserRuntimeEntry.js"
            },
            "releaseGate": "release-gate.json"
          }
          JSON

      - name: Inject Engine v1 runtime into reconstructed WebView shell
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/assets')
          target = root / 'engine-v1/runtime/BrowserRuntimeEntry.js'
          html_files = sorted(root.rglob('*.html'))
          if not html_files:
              raise SystemExit('No Android WebView HTML entrypoint found under app/src/main/assets')
          marker = 'data-plushbound-engine-v1="runtime"'
          injected = 0
          for html in html_files:
              text = html.read_text(encoding='utf-8')
              if marker in text:
                  injected += 1
                  continue
              rel = target.relative_to(html.parent) if target.is_relative_to(html.parent) else Path(__import__('os').path.relpath(target, html.parent))
              tag = f'<script type="module" src="{rel.as_posix()}" {marker}></script>'
              if '</body>' in text:
                  text = text.replace('</body>', tag + '\n</body>', 1)
              else:
                  text += '\n' + tag + '\n'
              html.write_text(text, encoding='utf-8')
              injected += 1
          print(f'Injected Engine v1 runtime into {injected} HTML file(s).')
          PY
          grep -R -q 'data-plushbound-engine-v1="runtime"' app/src/main/assets --include='*.html'

      - name: Validate packaged Engine v1 modules
        run: |
          test -f app/src/main/assets/engine-v1/core/EngineKernel.js
          test -f app/src/main/assets/engine-v1/platform/AndroidHostBridge.js
          test -f app/src/main/assets/engine-v1/platform/PerformanceBudget.js
          test -f app/src/main/assets/engine-v1/runtime/BrowserRuntimeEntry.js
          test -f app/src/main/assets/engine-v1/release-gate.json
          grep -q "${GITHUB_SHA}" app/src/main/assets/engine-v1/release-gate.json
          grep -R -q 'engine-v1/runtime/BrowserRuntimeEntry.js' app/src/main/assets --include='*.html'
          find app/src/main/assets/engine-v1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool app/src/main/assets/engine-v1/package-manifest.json >/dev/null
          python -m json.tool app/src/main/assets/engine-v1/release-gate.json >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build clean Engine v1 debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and embedded engine payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/engine-v1/core/EngineKernel.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/platform/AndroidHostBridge.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/platform/PerformanceBudget.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/runtime/BrowserRuntimeEntry.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/package-manifest.json'
          unzip -l "$APK" | grep -q 'assets/engine-v1/release-gate.json'
          unzip -p "$APK" assets/engine-v1/release-gate.json | grep -q "${GITHUB_SHA}"
          HTML=$(unzip -Z1 "$APK" | grep '^assets/.*\.html$' | head -n 1)
          test -n "$HTML"
          unzip -p "$APK" "$HTML" | grep -q 'data-plushbound-engine-v1="runtime"'
          unzip -p "$APK" "$HTML" | grep -q 'engine-v1/runtime/BrowserRuntimeEntry.js'

      - name: Verify Android installability metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.plushbound.legends'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt
          aapt dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo 'Engine v1 APK must remain offline and must not request INTERNET permission.' >&2
            exit 1
          fi
          apksigner verify --verbose --print-certs "$APK"
          zipalign -c -v 4 "$APK"

      - name: Record APK checksum
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee engine-v1-apk.sha256

      - name: Upload Engine v1 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-engine-v1-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            engine-v1-apk.sha256
            engine-v1-release-gate.json
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: error
