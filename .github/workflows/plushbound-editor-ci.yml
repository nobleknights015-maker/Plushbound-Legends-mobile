name: Plushbound Visual Editor CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'tools/editor/**'
      - 'game/runtime/**'
      - 'game/assets/asset-manifest.json'
      - 'game/tests/editor-core.test.js'
      - '.github/workflows/plushbound-editor-ci.yml'
  pull_request:
    paths:
      - 'tools/editor/**'
      - 'game/runtime/**'
      - 'game/assets/asset-manifest.json'
      - 'game/tests/editor-core.test.js'
      - '.github/workflows/plushbound-editor-ci.yml'

jobs:
  editor-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out game development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run editor core contracts
        run: |
          node --check tools/editor/editor-core.js
          node --check tools/editor/editor.js
          node --test game/tests/editor-core.test.js

      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >editor-http.log 2>&1 &
          echo $! > editor-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/tools/editor/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat editor-http.log
          exit 1

      - name: Simulate Elyndor world construction in Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
          const errors = [];
          page.on('pageerror', err => errors.push(String(err)));
          await page.goto('http://127.0.0.1:4173/tools/editor/index.html');
          await page.click('#loadElyndor');
          await page.waitForFunction(() => document.querySelectorAll('.event-marker').length >= 4);

          assert.match(await page.textContent('#status'), /Sunny Plains of Elyndor/);
          assert.equal(await page.locator('#mapCanvas').evaluate(el => el.style.width), '896px');
          assert.equal(await page.locator('#mapCanvas').evaluate(el => el.style.height), '560px');
          assert.equal(await page.locator('.tile').count(), 640);
          assert.ok(await page.locator('.asset-card').count() > 5);
          assert.ok(await page.evaluate(() => window.PlushboundEditor.getAssets().some(a => a.id === 'npc/lio/sprite')));

          // Layer authoring uses Engine v1's native map.layers contract.
          assert.equal(await page.locator('#layerSelect option').count(), 1);
          await page.fill('#tileId', '17');
          await page.click('[data-tool="tile"]');
          await page.locator('.tile[data-x="4"][data-y="5"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[0].data[5*32+4]), 17);
          await page.click('[data-tool="erase-tile"]');
          await page.locator('.tile[data-x="4"][data-y="5"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[0].data[5*32+4]), 0);
          await page.click('#addLayer');
          assert.equal(await page.locator('#layerSelect option').count(), 2);
          await page.fill('#layerZ', '10');
          await page.uncheck('#layerVisible');
          await page.click('#applyLayer');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[1].z), 10);
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].layers[1].visible), false);

          // Existing event movement and asset assignment.
          await page.click('[data-event-id="lio"]');
          const beforePages = await page.evaluate(() => JSON.stringify(window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'lio').pages));
          await page.fill('#eventX', '20');
          await page.fill('#eventY', '11');
          await page.selectOption('#eventAsset', 'npc/lio/sprite');
          await page.click('#applyEvent');
          assert.equal(await page.inputValue('#eventX'), '20');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'lio').assetId), 'npc/lio/sprite');
          const afterMovePages = await page.evaluate(() => JSON.stringify(window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'lio').pages));
          assert.equal(afterMovePages, beforePages);

          // Asset browser assignment is logical-ID driven.
          await page.fill('#assetSearch', 'chest');
          const chest = page.locator('[data-asset-id="environment/chest/elyndor-small"]');
          await chest.click();
          assert.equal(await page.inputValue('#eventAsset'), 'environment/chest/elyndor-small');

          // Place a brand-new event through the visual map.
          await page.fill('#newEventId', 'editor-browser-npc');
          await page.click('#armNewEvent');
          await page.locator('.tile[data-x="6"][data-y="6"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.inputValue('#eventId'), 'editor-browser-npc');
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'editor-browser-npc').pages[0].trigger), 'action');

          // MV-style page + command authoring on the new event.
          await page.selectOption('#pageTrigger', 'touch');
          await page.fill('#pageConditions', '{"switchId":"editor:browser-test","switchValue":true}');
          await page.click('#applyPage');
          await page.selectOption('#newCommandType', 'MESSAGE');
          await page.fill('#newCommandParameters', '["Hello from the visual editor"]');
          await page.click('#addCommand');
          let authored = await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].events.find(e => e.id === 'editor-browser-npc').pages[0]);
          assert.equal(authored.trigger, 'touch');
          assert.equal(authored.conditions.switchId, 'editor:browser-test');
          assert.equal(authored.commands[0].parameters[0], 'Hello from the visual editor');

          // Collision painting remains compatible with layer/event editing.
          await page.click('[data-tool="blocked"]');
          await page.locator('.tile[data-x="4"][data-y="4"]').click({ position: { x: 2, y: 2 } });
          assert.equal(await page.evaluate(() => window.PlushboundEditor.getPackage().maps[0].blocked.includes('4,4')), true);

          assert.deepEqual(errors, []);
          await browser.close();
          console.log('Plushbound editor world-construction simulation passed');
          NODE

      - name: Record editor simulation gate
        if: always()
        run: |
          cat > plushbound-editor-gate.txt <<EOF
          Plushbound Visual Editor simulation
          Browser: Chromium headless
          Target package: Elyndor runtime maps
          Coverage: native tile layers, tile painting, collision, asset manifest, event placement/assets, page settings, command authoring
          Result: ${{ job.status }}
          Commit: ${{ github.sha }}
          EOF

      - name: Upload editor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-editor-ci
          path: |
            plushbound-editor-gate.txt
            editor-http.log
          if-no-files-found: warn
