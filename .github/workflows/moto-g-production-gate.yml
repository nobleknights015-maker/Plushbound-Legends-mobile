name: Plushbound Moto G Production Gate

on:
  workflow_run:
    workflows: ["Plushbound Game Android APK"]
    types: [completed]
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'app/**'
      - 'tools/editor/**'
      - 'game/runtime/**'
      - 'game/content/**'
      - 'game/assets/**'
      - '.github/workflows/moto-g-production-gate.yml'
      - '.github/workflows/plushbound-game-android-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  moto-g-simulation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out game development
        uses: actions/checkout@v4
        with:
          ref: plushbound-game-development

      - name: Resolve source Android build run
        id: buildrun
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RUN_ID=""
          SOURCE_SHA=""

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$TRIGGER_RUN_ID"
            SOURCE_SHA="$TRIGGER_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            SOURCE_SHA="$PUSH_SHA"
            echo "Waiting for successful Android APK run for exact source $SOURCE_SHA..."
            for attempt in $(seq 1 30); do
              RUN_ID=$(gh api "/repos/$REPOSITORY/actions/workflows/plushbound-game-android-apk.yml/runs?branch=plushbound-game-development&head_sha=$SOURCE_SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
              if [ -n "$RUN_ID" ]; then
                break
              fi
              echo "Android APK run not ready yet (attempt $attempt/30)."
              sleep 10
            done
          else
            RUN_ID=$(gh api "/repos/$REPOSITORY/actions/workflows/plushbound-game-android-apk.yml/runs?branch=plushbound-game-development&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
            test -n "$RUN_ID"
            SOURCE_SHA=$(gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          fi

          test -n "$RUN_ID"
          test -n "$SOURCE_SHA"
          RUN_SHA=$(gh api "/repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          test "$RUN_SHA" = "$SOURCE_SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Using Plushbound Android build run $RUN_ID for exact source $SOURCE_SHA"

      - name: Download exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-game-debug-apk
          path: moto-g-artifact
          repository: ${{ github.repository }}
          run-id: ${{ steps.buildrun.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate downloaded APK
        run: |
          set -euo pipefail
          APK=$(find moto-g-artifact -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/tools/editor/index.html'
          unzip -l "$APK" | grep -q 'assets/tools/editor/editor-entry.js'
          cp "$APK" plushbound-moto-g-test.apk
          sha256sum plushbound-moto-g-test.apk | tee moto-g-tested-apk.sha256

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Moto G class editor launch and lifecycle smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: plushbound-moto-g
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -skin 720x1600
          script: |
            set -euo pipefail

            wait_for_editor_ready() {
              PHASE="$1"
              LOG_FILE="$2"
              MAX_ATTEMPTS="${3:-30}"
              for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
                adb logcat -d > "$LOG_FILE"
                if grep -q 'PLUSHBOUND_EDITOR_NOT_READY' "$LOG_FILE"; then
                  echo "Editor reported NOT_READY during $PHASE."
                  return 1
                fi
                if grep -q 'PLUSHBOUND_EDITOR_READY' "$LOG_FILE"; then
                  echo "Editor ready during $PHASE (attempt $attempt/$MAX_ATTEMPTS)."
                  return 0
                fi
                PID=$(adb shell pidof com.plushbound.legends 2>/dev/null | tr -d '\r' || true)
                if [ "$attempt" -ge 5 ] && [ -z "$PID" ]; then
                  echo "Plushbound process exited before readiness during $PHASE."
                  return 1
                fi
                sleep 2
              done
              adb logcat -d > "$LOG_FILE"
              echo "Timed out waiting for editor readiness during $PHASE."
              return 1
            }

            adb wait-for-device
            adb shell wm size 720x1600
            adb shell wm density 270
            adb logcat -c
            echo "Installing clean engine/editor APK on Moto G class emulator..."
            adb install -r plushbound-moto-g-test.apk
            echo "Cold launching Plushbound editor..."
            adb shell monkey -p com.plushbound.legends -c android.intent.category.LAUNCHER 1 >/dev/null
            wait_for_editor_ready "cold launch" moto-g-editor-startup-logcat.txt 30
            test -n "$(adb shell pidof com.plushbound.legends | tr -d '\r')"
            echo "Capturing editor startup diagnostics..."
            grep -E 'PlushboundEditor|chromium|cr_' moto-g-editor-startup-logcat.txt | tee moto-g-editor-startup-diagnostics.txt || true
            echo "Proving real editor modules executed in Android WebView..."
            grep -q 'PLUSHBOUND_EDITOR_READY' moto-g-editor-startup-logcat.txt
            ! grep -q 'PLUSHBOUND_EDITOR_NOT_READY' moto-g-editor-startup-logcat.txt
            echo "Recording initial memory footprint..."
            adb shell dumpsys meminfo com.plushbound.legends | tee moto-g-meminfo-initial.txt
            echo "Running constrained interaction smoke..."
            adb shell monkey -p com.plushbound.legends --pct-touch 35 --pct-motion 20 --pct-nav 15 --pct-majornav 10 --pct-appswitch 5 --throttle 80 -s 20261022 180 >/dev/null || true
            sleep 3
            test -n "$(adb shell pidof com.plushbound.legends | tr -d '\r')"
            echo "Background / foreground lifecycle check..."
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell monkey -p com.plushbound.legends -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 4
            test -n "$(adb shell pidof com.plushbound.legends | tr -d '\r')"
            echo "Rotation lifecycle check..."
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            sleep 3
            test -n "$(adb shell pidof com.plushbound.legends | tr -d '\r')"
            adb shell settings put system user_rotation 0 || true
            sleep 3
            test -n "$(adb shell pidof com.plushbound.legends | tr -d '\r')"
            adb shell settings put system accelerometer_rotation 1 || true
            echo "Memory pressure check..."
            adb shell am send-trim-memory com.plushbound.legends RUNNING_LOW || true
            sleep 2
            test -n "$(adb shell pidof com.plushbound.legends | tr -d '\r')"
            echo "Force-stop / clean relaunch check..."
            adb shell am force-stop com.plushbound.legends
            sleep 1
            adb logcat -c
            adb shell monkey -p com.plushbound.legends -c android.intent.category.LAUNCHER 1 >/dev/null
            wait_for_editor_ready "force-stop relaunch" moto-g-editor-relaunch-logcat.txt 30
            test -n "$(adb shell pidof com.plushbound.legends | tr -d '\r')"
            adb shell dumpsys meminfo com.plushbound.legends | tee moto-g-meminfo-final.txt
            adb shell dumpsys gfxinfo com.plushbound.legends framestats | tee moto-g-gfxinfo.txt || true
            adb logcat -d > moto-g-logcat.txt
            echo "Checking for application crashes and ANRs..."
            grep -E -A12 -B5 'FATAL EXCEPTION|ANR in com\.plushbound\.legends|Process com\.plushbound\.legends .* has died' moto-g-logcat.txt | tee moto-g-crash-scan.txt || true
            ! grep -E -A12 -B5 'FATAL EXCEPTION|ANR in com\.plushbound\.legends|Process com\.plushbound\.legends .* has died' moto-g-logcat.txt | grep -q 'com.plushbound.legends'
            echo "Moto G class editor simulation gate passed."

      - name: Record Moto G production gate result
        if: always()
        run: |
          cat > moto-g-production-gate.txt <<EOF
          Plushbound Legends Moto G engine/editor production simulation
          Target class: 2025 Moto G baseline
          Physical RAM assumption: 4 GB
          Virtual RAM is not counted as guaranteed process RAM
          Emulator viewport: 720x1600
          Android API: 35
          Editor module readiness: required
          Readiness policy: poll for explicit ready/not-ready signal, no fixed launch timer
          Rotation lifecycle: required
          Result: ${{ job.status }}
          Source commit: ${{ steps.buildrun.outputs.source_sha }}
          Source Android workflow run: ${{ steps.buildrun.outputs.run_id }}
          EOF

      - name: Upload Moto G diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-moto-g-production-gate
          path: |
            moto-g-production-gate.txt
            moto-g-tested-apk.sha256
            moto-g-editor-startup-logcat.txt
            moto-g-editor-startup-diagnostics.txt
            moto-g-editor-relaunch-logcat.txt
            moto-g-meminfo-initial.txt
            moto-g-meminfo-final.txt
            moto-g-gfxinfo.txt
            moto-g-logcat.txt
            moto-g-crash-scan.txt
          if-no-files-found: warn
