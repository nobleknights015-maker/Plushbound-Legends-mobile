name: Plushbound Game Android APK

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'game/**'
      - 'tools/editor/**'
      - 'gradle.properties'
      - '.github/workflows/plushbound-game-android-apk.yml'

jobs:
  build-game-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frozen engine, game and editor contracts
        run: |
          set -euo pipefail
          (cd engine && npm test)
          node --test engine/tests/final_acceptance_gate.test.js
          node --test engine/tests/freeze_readiness_gate.test.js
          node --test game/tests/*.test.js
          find tools/editor game/runtime engine/src -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find game/content game/runtime game/assets -name '*.json' -print0 | xargs -0 -r -n1 node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))"

      - name: Assert obsolete demo reconstruction is gone
        run: |
          set -euo pipefail
          test ! -e project-source.zip
          test ! -d source_chunks
          test ! -e .github/workflows/android-debug-apk.yml
          test ! -e .github/workflows/engine-v1-android-apk.yml
          echo 'Legacy reconstructed demo path is absent'

      - name: Assemble clean engine + editor asset surface
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets
          mkdir -p app/src/main/assets/tools app/src/main/assets/game app/src/main/assets/engine
          cp -R tools/editor app/src/main/assets/tools/editor
          cp -R game/content app/src/main/assets/game/content
          cp -R game/runtime app/src/main/assets/game/runtime
          cp -R game/assets app/src/main/assets/game/assets
          cp -R engine/src app/src/main/assets/engine/src
          mkdir -p app/src/main/assets/engine/content
          cp engine/content/asset-manifest.json app/src/main/assets/engine/content/asset-manifest.json
          sed -i 's#<script type="module" src="./editor.js"></script>#<script type="module" src="./editor-entry.js"></script>#' app/src/main/assets/tools/editor/index.html
          grep -q 'editor-entry.js' app/src/main/assets/tools/editor/index.html
          test -f app/src/main/assets/tools/editor/editor-entry.js
          test -f app/src/main/assets/tools/editor/editor.js
          test -f app/src/main/assets/tools/editor/editor.css
          test -f app/src/main/assets/game/runtime/PlushboundGameSession.js
          test -f app/src/main/assets/engine/src/core/GameState.js
          test ! -f app/src/main/assets/index.html
          test ! -f app/src/main/assets/game.js
          test ! -f app/src/main/assets/style.css
          echo 'Old placeholder demo shell is absent from packaged assets'

      - name: Apply official Plushbound launcher icon
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python game/tools/apply-android-launcher-icon.py
          grep -q 'android:icon="@mipmap/plushbound_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/plushbound_launcher_round"' app/src/main/AndroidManifest.xml

      - name: Verify editor boot target and repository-shaped payload
        run: |
          set -euo pipefail
          grep -q 'https://appassets.androidplatform.net/assets/tools/editor/index.html' app/src/main/java/com/plushbound/legends/MainActivity.java
          grep -q 'WebViewAssetLoader' app/src/main/java/com/plushbound/legends/MainActivity.java
          grep -q 'PLUSHBOUND_EDITOR_READY' app/src/main/java/com/plushbound/legends/MainActivity.java
          grep -q 'applicationId = "com.plushbound.legends"' app/build.gradle.kts
          grep -q 'android.useAndroidX=true' gradle.properties
          test -f app/src/main/assets/tools/editor/battle-test.html
          test -f app/src/main/assets/tools/editor/database.html
          test -f app/src/main/assets/tools/editor/common-events.html
          test -f app/src/main/assets/game/content/content-index.json
          test -f app/src/main/assets/game/assets/asset-manifest.json
          test -f app/src/main/assets/engine/content/asset-manifest.json
          echo 'Clean engine/editor package surface verified'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build clean editor debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK contains editor, engine and game payload
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/tools/editor/index.html'
          unzip -l "$APK" | grep -q 'assets/tools/editor/editor-entry.js'
          unzip -l "$APK" | grep -q 'assets/tools/editor/editor.js'
          unzip -l "$APK" | grep -q 'assets/game/runtime/PlushboundGameSession.js'
          unzip -l "$APK" | grep -q 'assets/engine/src/core/GameState.js'
          sha256sum "$APK" | tee plushbound-editor-apk.sha256

      - name: Upload clean editor APK
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-game-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            plushbound-editor-apk.sha256
          if-no-files-found: error
