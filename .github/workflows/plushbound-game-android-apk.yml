name: Plushbound Game Android APK

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'game/**'
      - '.github/workflows/plushbound-game-android-apk.yml'

jobs:
  build-game-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate game JSON and runtime contracts
        run: |
          find game/content game/runtime -name '*.json' -print0 | xargs -0 -r -n1 node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))"
          node --test game/tests/*.test.js

      - name: Re-verify frozen Engine v1 baseline
        working-directory: engine
        run: |
          npm test
          node --test tests/final_acceptance_gate.test.js
          node --test tests/freeze_readiness_gate.test.js

      - name: Record game package gate
        run: |
          cat > plushbound-game-release-gate.json <<JSON
          {
            "game": "Plushbound Legends",
            "branch": "plushbound-game-development",
            "gameCommit": "${GITHUB_SHA}",
            "engineBaseline": "160d9fd95bc0d3db39224f8bb4c5e1e3a1f54425",
            "status": "passed"
          }
          JSON
          python -m json.tool plushbound-game-release-gate.json >/dev/null

      - name: Reconstruct clean Android project source
        run: |
          cat source_chunks/part_* > project-source.b64
          base64 -d project-source.b64 > project-source-fixed.zip
          unzip -o project-source-fixed.zip -d .

      - name: Apply native-feel fixed viewport shell policy
        run: |
          python - <<'PY'
          from pathlib import Path
          css_files = sorted(Path('app/src/main/assets').rglob('style.css'))
          if not css_files:
              raise SystemExit('No shell stylesheet found under app/src/main/assets')
          native_css = "\n/* Plushbound Engine v1 native-surface policy: no document or panel scrolling. */\nhtml,body,#app{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden!important;overscroll-behavior:none!important;touch-action:none!important}\n.screen,.overlay{overflow:hidden!important;min-width:0!important;min-height:0!important}\n.panel{overflow:hidden!important;max-height:calc(100dvh - 16px)!important;max-width:calc(100dvw - 16px)!important}\n#creatorScreen .panel,#starterScreen .panel,#mapScreen .panel,#menuScreen .panel,#creditsScreen .panel{height:min(680px,calc(100dvh - 16px));display:flex;flex-direction:column;min-height:0}\n#creatorScreen .creator-grid{flex:1;min-height:0;overflow:hidden;grid-template-columns:minmax(180px,30%) 1fr}\n#creatorScreen .avatar-preview{min-height:0;height:100%}\n#creatorScreen .creator-form{min-height:0;align-content:center}\n#starterScreen .starter-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-height:0}\n#starterScreen .starter-card{min-height:0;padding:10px}\n#starterScreen .starter-icon{font-size:34px;margin-bottom:4px}\n#starterScreen .starter-stat{margin-top:6px}\n#starterScreen .starter-detail{margin-top:8px;padding:10px;line-height:1.25}\n#starterScreen .row-actions{margin-top:8px}\n#mapScreen .world-map{flex:1;min-height:220px;height:auto}\n#mapScreen .map-info{flex:0 0 auto}\n#menuScreen .menu-grid{flex:1;min-height:0;align-content:center}\n#menuScreen .info-card{min-height:0}\n#creditsScreen .credits-copy{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:4px;align-content:center;font-size:13px;line-height:1.35}\n@media (max-height:600px){.screen,.overlay{padding:8px!important}.panel{padding:12px!important}.section-heading{margin-bottom:8px!important}.section-heading h2{font-size:22px!important}button{min-height:38px!important;padding:7px 12px!important}#starterScreen .starter-grid{gap:6px!important}#mapScreen .world-map{min-height:180px}}\n"
          for css in css_files:
              text = css.read_text(encoding='utf-8')
              if 'Plushbound Engine v1 native-surface policy' not in text:
                  css.write_text(text + native_css, encoding='utf-8')
          PY

      - name: Package frozen engine and game runtime
        run: |
          rm -rf app/src/main/assets/engine-v1 app/src/main/assets/game
          mkdir -p app/src/main/assets/engine-v1/content app/src/main/assets/game
          cp -R engine/src/. app/src/main/assets/engine-v1/
          cp engine/content/asset-manifest.json app/src/main/assets/engine-v1/content/asset-manifest.json
          cp -R game/content app/src/main/assets/game/content
          cp -R game/runtime app/src/main/assets/game/runtime
          cp plushbound-game-release-gate.json app/src/main/assets/game/release-gate.json
          python - <<'PY'
          from pathlib import Path
          for js in Path('app/src/main/assets/game/runtime').rglob('*.js'):
              text = js.read_text(encoding='utf-8')
              text = text.replace('../../engine/src/', '../../engine-v1/')
              js.write_text(text, encoding='utf-8')
          PY
          cat > app/src/main/assets/game/package-manifest.json <<'JSON'
          {
            "game": "Plushbound Legends",
            "engineBaseline": "160d9fd95bc0d3db39224f8bb4c5e1e3a1f54425",
            "bootstrap": "runtime/AndroidGameBootstrap.js",
            "contentIndex": "content/content-index.json",
            "runtimeMaps": "runtime/elyndor-route-one.maps.json",
            "releaseGate": "release-gate.json"
          }
          JSON

      - name: Inject frozen engine and Plushbound game bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path('app/src/main/assets')
          engine = root / 'engine-v1/runtime/BrowserRuntimeEntry.js'
          manifest = root / 'engine-v1/content/asset-manifest.json'
          game = root / 'game/runtime/AndroidGameBootstrap.js'
          html_files = sorted(root.rglob('*.html'))
          if not html_files:
              raise SystemExit('No Android WebView HTML entrypoint found')
          for html in html_files:
              text = html.read_text(encoding='utf-8')
              engine_rel = Path(os.path.relpath(engine, html.parent)).as_posix()
              manifest_rel = Path(os.path.relpath(manifest, html.parent)).as_posix()
              game_rel = Path(os.path.relpath(game, html.parent)).as_posix()
              engine_tag = f'<script type="module" src="{engine_rel}" data-plushbound-engine-v1="runtime" data-asset-manifest="{manifest_rel}"></script>'
              game_tag = f'<script type="module" src="{game_rel}" data-plushbound-game="runtime"></script>'
              tags = []
              if 'data-plushbound-engine-v1="runtime"' not in text: tags.append(engine_tag)
              if 'data-plushbound-game="runtime"' not in text: tags.append(game_tag)
              if tags:
                  injection = '\n'.join(tags)
                  text = text.replace('</body>', injection + '\n</body>', 1) if '</body>' in text else text + '\n' + injection
              html.write_text(text, encoding='utf-8')
          PY

      - name: Validate packaged game payload
        run: |
          test -f app/src/main/assets/engine-v1/core/GameState.js
          test -f app/src/main/assets/engine-v1/maps/MapRuntime.js
          test -f app/src/main/assets/game/runtime/AndroidGameBootstrap.js
          test -f app/src/main/assets/game/runtime/PlushboundGameSession.js
          test -f app/src/main/assets/game/runtime/GameContentRuntime.js
          test -f app/src/main/assets/game/runtime/elyndor-route-one.maps.json
          test -f app/src/main/assets/game/content/content-index.json
          grep -q '160d9fd95bc0d3db39224f8bb4c5e1e3a1f54425' app/src/main/assets/game/content/content-index.json
          grep -q '../../engine-v1/core/GameState.js' app/src/main/assets/game/runtime/AndroidGameBootstrap.js
          grep -q '../../engine-v1/maps/MapRuntime.js' app/src/main/assets/game/runtime/PlushboundGameSession.js
          grep -R -q 'data-plushbound-game="runtime"' app/src/main/assets --include='*.html'
          grep -R -q 'Plushbound Engine v1 native-surface policy' app/src/main/assets --include='style.css'
          find app/src/main/assets/engine-v1 app/src/main/assets/game/runtime -name '*.js' -print0 | xargs -0 -n1 node --check
          find app/src/main/assets/game -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build Plushbound game debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK game payload and installability
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/engine-v1/core/GameState.js'
          unzip -l "$APK" | grep -q 'assets/game/runtime/AndroidGameBootstrap.js'
          unzip -l "$APK" | grep -q 'assets/game/runtime/elyndor-route-one.maps.json'
          unzip -l "$APK" | grep -q 'assets/game/content/content-index.json'
          unzip -p "$APK" assets/game/release-gate.json | grep -q "${GITHUB_SHA}"
          HTML=$(unzip -Z1 "$APK" | grep '^assets/.*\.html$' | head -n 1)
          CSS=$(unzip -Z1 "$APK" | grep '^assets/.*style\.css$' | head -n 1)
          unzip -p "$APK" "$HTML" | grep -q 'data-plushbound-game="runtime"'
          unzip -p "$APK" "$CSS" | grep -q 'overflow:hidden!important'
          aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.plushbound.legends'" apk-badging.txt
          aapt dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then exit 1; fi
          apksigner verify --verbose --print-certs "$APK"
          zipalign -c -v 4 "$APK"

      - name: Record game APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee plushbound-game-apk.sha256

      - name: Upload Plushbound game Android APK
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-game-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            plushbound-game-apk.sha256
            plushbound-game-release-gate.json
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: error
