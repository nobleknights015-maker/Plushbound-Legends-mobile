name: Plushbound MV Compatibility CI

on:
  push:
    branches: [plushbound-game-development]
    paths:
      - 'tools/editor/mv-project-core.js'
      - 'tools/editor/mv-database-contracts.js'
      - 'tools/editor/mv-shell-contracts.js'
      - 'tools/editor/mv-event-command-adapter.js'
      - 'tools/editor/mv-editor-adapter.js'
      - 'tools/editor/mv-file-import.js'
      - 'tools/editor/mv-zip.js'
      - 'tools/editor/mv-tile-id-contracts.js'
      - 'tools/editor/mv-autotile-composition.js'
      - 'tools/editor/mv-browser-integration.js'
      - 'tools/editor/mv-raw-command-ui.js'
      - 'tools/editor/editor-deeplinks.js'
      - 'engine/src/editor/WorldEditorProjectAdapter.js'
      - 'engine/src/maps/MapRuntime.js'
      - 'engine/tests/world_editor_project_adapter.test.js'
      - 'game/tests/mv-project-core.test.js'
      - 'game/tests/mv-database-contracts.test.js'
      - 'game/tests/mv-shell-contracts.test.js'
      - 'game/tests/mv-event-command-adapter.test.js'
      - 'game/tests/mv-editor-adapter.test.js'
      - 'game/tests/mv-file-import.test.js'
      - 'game/tests/mv-zip.test.js'
      - 'game/tests/mv-tile-id-contracts.test.js'
      - 'game/tests/mv-autotile-composition.test.js'
      - 'game/tests/mv-raw-command-ui.test.js'
      - '.github/workflows/plushbound-mv-compat-ci.yml'
  workflow_dispatch:

jobs:
  mv-project-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check MV compatibility modules
        run: |
          node --check tools/editor/mv-project-core.js
          node --check tools/editor/mv-database-contracts.js
          node --check tools/editor/mv-shell-contracts.js
          node --check tools/editor/mv-event-command-adapter.js
          node --check tools/editor/mv-editor-adapter.js
          node --check tools/editor/mv-file-import.js
          node --check tools/editor/mv-zip.js
          node --check tools/editor/mv-tile-id-contracts.js
          node --check tools/editor/mv-autotile-composition.js
          node --check tools/editor/mv-browser-integration.js
          node --check tools/editor/mv-raw-command-ui.js
          node --check engine/src/editor/WorldEditorProjectAdapter.js
          node --check engine/src/maps/MapRuntime.js
      - name: Test all MV compatibility contracts
        run: node --test game/tests/mv-project-core.test.js game/tests/mv-database-contracts.test.js game/tests/mv-shell-contracts.test.js game/tests/mv-event-command-adapter.test.js game/tests/mv-editor-adapter.test.js game/tests/mv-file-import.test.js game/tests/mv-zip.test.js game/tests/mv-tile-id-contracts.test.js game/tests/mv-autotile-composition.test.js game/tests/mv-raw-command-ui.test.js
      - name: Test World Editor to Engine v1 runtime contract
        run: node --test engine/tests/world_editor_project_adapter.test.js
