name: Plushbound Project Search CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'tools/editor/project-search*'
      - 'tools/editor/editor-navigation-core.js'
      - 'tools/editor/editor-deeplinks.js'
      - 'tools/editor/index.html'
      - 'tools/editor/database.html'
      - 'tools/editor/map-manager.html'
      - 'tools/editor/audio.html'
      - 'game/content/**'
      - 'game/runtime/**'
      - 'game/assets/asset-manifest.json'
      - 'game/tests/project-search-core.test.js'
      - 'game/tests/editor-navigation-core.test.js'
      - '.github/workflows/plushbound-project-search-ci.yml'
  pull_request:
    paths:
      - 'tools/editor/project-search*'
      - 'tools/editor/editor-navigation-core.js'
      - 'tools/editor/editor-deeplinks.js'
      - 'tools/editor/index.html'
      - 'tools/editor/database.html'
      - 'tools/editor/map-manager.html'
      - 'tools/editor/audio.html'
      - 'game/content/**'
      - 'game/runtime/**'
      - 'game/assets/asset-manifest.json'
      - 'game/tests/project-search-core.test.js'
      - 'game/tests/editor-navigation-core.test.js'
      - '.github/workflows/plushbound-project-search-ci.yml'

jobs:
  project-search-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run project search contracts
        run: |
          node --check tools/editor/project-search-core.js
          node --check tools/editor/project-search.js
          node --check tools/editor/editor-navigation-core.js
          node --check tools/editor/editor-deeplinks.js
          node --test game/tests/project-search-core.test.js game/tests/editor-navigation-core.test.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 >project-search-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4175/tools/editor/project-search.html >/dev/null && exit 0
            sleep 1
          done
          cat project-search-http.log
          exit 1
      - name: Simulate project search and deep links on Android viewport
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:412,height:915}});
          const errors=[];page.on('pageerror',error=>errors.push(String(error)));
          await page.goto('http://127.0.0.1:4175/tools/editor/project-search.html');
          await page.waitForFunction(()=>window.PlushboundProjectSearch?.getIndex().length>100);
          assert.ok((await page.locator('.result').count())>0);

          await page.locator('#projectType').selectOption('content');
          await page.locator('#projectQuery').fill('threads-out-of-tune');
          await page.waitForTimeout(50);
          const databaseLink=page.locator('.result a.result-open[href*="database.html"]').first();
          assert.ok(await databaseLink.count());
          const databaseHref=await databaseLink.getAttribute('href');
          assert.match(databaseHref,/record=threads-out-of-tune/);
          const db=await browser.newPage({viewport:{width:412,height:915}});const dbErrors=[];db.on('pageerror',error=>dbErrors.push(String(error)));
          await db.goto(new URL(databaseHref,page.url()).href);
          await db.waitForFunction(()=>document.querySelector('#recordIdentity')?.textContent.includes('threads-out-of-tune'));
          assert.deepEqual(dbErrors,[]);await db.close();

          await page.locator('#projectType').selectOption('runtime');
          await page.locator('#projectQuery').fill('anchor-west');
          await page.waitForTimeout(50);
          const mapLink=page.locator('.result a.result-open[href*="index.html"][href*="event=anchor-west"]').first();
          assert.ok(await mapLink.count());
          const mapHref=await mapLink.getAttribute('href');
          const editor=await browser.newPage({viewport:{width:412,height:915}});const editorErrors=[];editor.on('pageerror',error=>editorErrors.push(String(error)));
          await editor.goto(new URL(mapHref,page.url()).href);
          await editor.waitForFunction(()=>window.PlushboundEditor?.getSelectedEventId?.()==='anchor-west');
          assert.equal(await editor.locator('#mapSelect').inputValue(),'elyndor-sunthread-crossing');
          assert.deepEqual(editorErrors,[]);await editor.close();

          await page.locator('#projectType').selectOption('assets');
          await page.locator('#projectQuery').fill('npc/lio/sprite');
          await page.waitForTimeout(50);
          assert.ok((await page.locator('.result a.result-open').count())>0);
          assert.deepEqual(errors,[]);
          await browser.close();
          console.log('Android project search + editor deep-link simulation passed');
          NODE