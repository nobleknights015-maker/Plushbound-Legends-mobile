name: Plushbound Database CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'tools/editor/database*'
      - 'game/content/**'
      - 'game/tests/database*.test.js'
      - '.github/workflows/plushbound-database-ci.yml'
  pull_request:
    paths:
      - 'tools/editor/database*'
      - 'game/content/**'
      - 'game/tests/database*.test.js'
      - '.github/workflows/plushbound-database-ci.yml'

jobs:
  database-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out game development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run database contracts
        run: |
          node --check tools/editor/database-core.js
          node --check tools/editor/database.js
          node --test game/tests/database*.test.js

      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 >database-http.log 2>&1 &
          echo $! > database-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/tools/editor/database.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat database-http.log
          exit 1

      - name: Simulate domain-aware database authoring in Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 412, height: 915 } });
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));
          await page.goto('http://127.0.0.1:4174/tools/editor/database.html');
          await page.waitForFunction(() => window.PlushboundDatabase?.getState().packages.length > 0);

          let state = await page.evaluate(() => window.PlushboundDatabase.getState());
          const guardianIndex = state.packages.findIndex(entry => entry.id === 'guardians');
          assert.ok(guardianIndex >= 0);
          await page.evaluate(index => window.PlushboundDatabase.selectPackage(index), guardianIndex);
          await page.evaluate(() => window.PlushboundDatabase.selectCollection('starters'));
          await page.locator('[data-locator="0"]').click();
          assert.match(await page.textContent('#recordIdentity'), /Plush Guardians.*cinder/i);
          assert.ok(await page.locator('.field-group').count() >= 2);
          assert.ok(await page.locator('[data-field-input="name"]').count());
          assert.ok(await page.locator('[data-field-input="assetBindings.sprite"]').count());

          const before = await page.evaluate(() => structuredClone(window.PlushboundDatabase.getActivePackage().data.starters[0]));
          await page.fill('[data-field-input="name"]', 'Cinder Editor Test');
          await page.fill('[data-field-input="assetBindings.sprite"]', 'guardian/cinder/sprite-editor-test');
          await page.click('#applyFields');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.starters[0].name), 'Cinder Editor Test');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.starters[0].assetBindings.sprite), 'guardian/cinder/sprite-editor-test');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.starters[0].assetBindings.battle), before.assetBindings.battle);

          await page.click('#undoDatabase');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.starters[0].name), before.name);
          await page.click('#redoDatabase');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.starters[0].name), 'Cinder Editor Test');

          const packageBeforeInvalidEdit = await page.evaluate(() => JSON.stringify(window.PlushboundDatabase.getActivePackage().data));
          const undoCountBeforeInvalidEdit = await page.evaluate(() => window.PlushboundDatabase.getState().history.undo.length);
          await page.fill('[data-field-input="id"]', 'mallow');
          page.once('dialog', dialog => dialog.accept());
          await page.click('#applyFields');
          assert.equal(await page.evaluate(() => JSON.stringify(window.PlushboundDatabase.getActivePackage().data)), packageBeforeInvalidEdit);
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getState().history.undo.length), undoCountBeforeInvalidEdit);

          // Enemy domain: typed stats + primitive-list skills/tags.
          state = await page.evaluate(() => window.PlushboundDatabase.getState());
          const enemyIndex = state.packages.findIndex(entry => entry.id === 'verdancia-enemies');
          assert.ok(enemyIndex >= 0);
          await page.evaluate(index => window.PlushboundDatabase.selectPackage(index), enemyIndex);
          await page.evaluate(() => window.PlushboundDatabase.selectCollection('enemies'));
          await page.locator('[data-locator="0"]').click();
          assert.match(await page.textContent('#recordIdentity'), /Enemies/);
          assert.ok(await page.locator('[data-field-input="stats.hp"]').count());
          assert.ok(await page.locator('[data-field-input="tags"]').count());
          assert.ok(await page.locator('[data-field-input="skills"]').count());
          const dropsBefore = await page.evaluate(() => structuredClone(window.PlushboundDatabase.getActivePackage().data.enemies[0].rewards.drops));
          await page.fill('[data-field-input="stats.hp"]', '99');
          await page.fill('[data-field-input="tags"]', '["frayling","verdancia","editor-test"]');
          await page.fill('[data-field-input="skills"]', 'fray-scratch, moss-dart, editor-skill');
          await page.click('#applyFields');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies[0].stats.hp), 99);
          assert.deepEqual(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies[0].tags), ['frayling','verdancia','editor-test']);
          assert.deepEqual(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies[0].skills), ['fray-scratch','moss-dart','editor-skill']);
          assert.deepEqual(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies[0].rewards.drops), dropsBefore);

          // Collection-specific New uses a structurally useful enemy template.
          const countBeforeNew = await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies.length);
          await page.click('#newRecord');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies.length), countBeforeNew + 1);
          const created = await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies.at(-1));
          assert.ok(created.id.startsWith('new-enemy-'));
          assert.equal(created.level, 1);
          assert.equal(created.stats.hp, 1);
          assert.deepEqual(created.skills, []);
          await page.click('#undoDatabase');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies.length), countBeforeNew);

          assert.deepEqual(errors, []);
          await browser.close();
          console.log('Plushbound domain-aware visual database mobile authoring simulation passed');
          NODE

      - name: Record database simulation gate
        if: always()
        run: |
          cat > plushbound-database-gate.txt <<EOF
          Plushbound Database simulation
          Browser: Chromium headless (412x915 Android-class viewport)
          Coverage: Guardian + enemy domain forms, grouped typed fields, nested fields, primitive-list tags/skills, domain new-record templates, nested-data preservation, undo/redo, invalid-edit rollback
          Result: ${{ job.status }}
          Commit: ${{ github.sha }}
          EOF

      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-database-ci
          path: |
            plushbound-database-gate.txt
            database-http.log
          if-no-files-found: warn
