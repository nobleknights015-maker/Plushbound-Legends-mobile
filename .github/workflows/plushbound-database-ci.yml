name: Plushbound Database CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'tools/editor/database*'
      - 'tools/editor/common-event*'
      - 'tools/editor/editor-core.js'
      - 'tools/editor/index.html'
      - 'game/content/**'
      - 'game/tests/database*.test.js'
      - 'game/tests/common-event-core.test.js'
      - '.github/workflows/plushbound-database-ci.yml'
  pull_request:
    paths:
      - 'tools/editor/database*'
      - 'tools/editor/common-event*'
      - 'tools/editor/editor-core.js'
      - 'tools/editor/index.html'
      - 'game/content/**'
      - 'game/tests/database*.test.js'
      - 'game/tests/common-event-core.test.js'
      - '.github/workflows/plushbound-database-ci.yml'

jobs:
  database-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out game development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run database and common-event contracts
        run: |
          node --check tools/editor/editor-core.js
          node --check tools/editor/database-core.js
          node --check tools/editor/database.js
          node --check tools/editor/common-event-core.js
          node --check tools/editor/common-events.js
          node --test game/tests/database*.test.js game/tests/common-event-core.test.js

      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 >database-http.log 2>&1 &
          echo $! > database-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/tools/editor/database.html >/dev/null && curl -fsS http://127.0.0.1:4174/tools/editor/common-events.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat database-http.log
          exit 1

      - name: Simulate structured database and common-event authoring in Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 412, height: 915 } });
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));
          await page.goto('http://127.0.0.1:4174/tools/editor/database.html');
          await page.waitForFunction(() => window.PlushboundDatabase?.getState().packages.length > 0);

          let state = await page.evaluate(() => window.PlushboundDatabase.getState());
          const guardianIndex = state.packages.findIndex(entry => entry.id === 'guardians');
          assert.ok(guardianIndex >= 0);
          await page.evaluate(index => window.PlushboundDatabase.selectPackage(index), guardianIndex);
          await page.evaluate(() => window.PlushboundDatabase.selectCollection('starters'));
          await page.locator('[data-locator="0"]').click();
          assert.match(await page.textContent('#recordIdentity'), /Plush Guardians.*cinder/i);
          assert.ok(await page.locator('[data-field-input="name"]').count());
          const guardianBefore = await page.evaluate(() => structuredClone(window.PlushboundDatabase.getActivePackage().data.starters[0]));
          await page.fill('[data-field-input="name"]', 'Cinder Editor Test');
          await page.click('#applyFields');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.starters[0].name), 'Cinder Editor Test');
          await page.click('#undoDatabase');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.starters[0].name), guardianBefore.name);

          state = await page.evaluate(() => window.PlushboundDatabase.getState());
          const enemyIndex = state.packages.findIndex(entry => entry.id === 'verdancia-enemies');
          assert.ok(enemyIndex >= 0);
          await page.evaluate(index => window.PlushboundDatabase.selectPackage(index), enemyIndex);
          await page.evaluate(() => window.PlushboundDatabase.selectCollection('encounterTables'));
          await page.locator('[data-locator="0"]').click();
          const weightBefore = await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.encounterTables[0].entries[0].weight);
          await page.fill('[data-nested-path="entries"][data-nested-index="0"][data-nested-key="weight"]', '61');
          await page.click('#applyFields');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.encounterTables[0].entries[0].weight),61);
          await page.click('#undoDatabase');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.encounterTables[0].entries[0].weight),weightBefore);

          await page.evaluate(() => window.PlushboundDatabase.selectCollection('enemies'));
          await page.locator('[data-locator="0"]').click();
          const dropBefore = await page.evaluate(() => structuredClone(window.PlushboundDatabase.getActivePackage().data.enemies[0].rewards.drops[0]));
          await page.fill('[data-nested-path="rewards.drops"][data-nested-index="0"][data-nested-key="chance"]','0.25');
          await page.click('#applyFields');
          assert.equal(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies[0].rewards.drops[0].chance),0.25);
          await page.click('#undoDatabase');
          assert.deepEqual(await page.evaluate(() => window.PlushboundDatabase.getActivePackage().data.enemies[0].rewards.drops[0]),dropBefore);

          // Common Events: create, rename, add/edit/reorder commands, undo/redo at Android viewport.
          await page.goto('http://127.0.0.1:4174/tools/editor/common-events.html');
          await page.waitForFunction(() => !!window.PlushboundCommonEvents);
          assert.ok(await page.locator('#commonCommandType option').count() >= 30);
          await page.click('#addCommon');
          assert.equal(await page.evaluate(() => window.PlushboundCommonEvents.getLibrary().commonEvents.length),1);
          await page.fill('#commonId','arrival-sequence');
          await page.fill('#commonName','Arrival Sequence');
          await page.click('#applyCommon');
          assert.equal(await page.evaluate(() => window.PlushboundCommonEvents.getLibrary().commonEvents[0].id),'arrival-sequence');

          await page.selectOption('#commonCommandType','MESSAGE');
          await page.fill('#commonCommandParameters','["Welcome to Plushtopia.", {"speaker":"Guide"}]');
          await page.click('#addCommonCommand');
          await page.selectOption('#commonCommandType','VARIABLE');
          await page.fill('#commonCommandParameters','["arrival-count", 1]');
          await page.click('#addCommonCommand');
          let commands = await page.evaluate(() => window.PlushboundCommonEvents.getLibrary().commonEvents[0].commands);
          assert.deepEqual(commands.map(command => command.code),['MESSAGE','VARIABLE']);
          assert.equal(commands[1].parameters[0],'arrival-count');

          const downButtons=page.locator('.common-command-actions button', {hasText:'↓'});
          await downButtons.first().click();
          commands = await page.evaluate(() => window.PlushboundCommonEvents.getLibrary().commonEvents[0].commands);
          assert.deepEqual(commands.map(command => command.code),['VARIABLE','MESSAGE']);
          await page.click('#undoCommon');
          commands = await page.evaluate(() => window.PlushboundCommonEvents.getLibrary().commonEvents[0].commands);
          assert.deepEqual(commands.map(command => command.code),['MESSAGE','VARIABLE']);
          await page.click('#redoCommon');
          commands = await page.evaluate(() => window.PlushboundCommonEvents.getLibrary().commonEvents[0].commands);
          assert.deepEqual(commands.map(command => command.code),['VARIABLE','MESSAGE']);
          assert.match(await page.textContent('#commonValidation'),/valid/i);

          assert.deepEqual(errors, []);
          await browser.close();
          console.log('Plushbound database + common events mobile authoring simulation passed');
          NODE

      - name: Record database simulation gate
        if: always()
        run: |
          cat > plushbound-database-gate.txt <<EOF
          Plushbound authoring simulation
          Browser: Chromium headless (412x915 Android-class viewport)
          Coverage: Guardian forms, structured encounter/drop rows, database history, visual common-event create/rename/command edit/reorder/undo/redo, full Engine v1 command vocabulary
          Result: ${{ job.status }}
          Commit: ${{ github.sha }}
          EOF

      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-database-ci
          path: |
            plushbound-database-gate.txt
            database-http.log
          if-no-files-found: warn
