name: Plushbound Mobile Layout CI

on:
  workflow_dispatch:
  push:
    branches: [ plushbound-game-development ]
    paths:
      - 'tools/editor/**'
      - '.github/workflows/plushbound-mobile-layout-ci.yml'
  pull_request:
    paths:
      - 'tools/editor/**'
      - '.github/workflows/plushbound-mobile-layout-ci.yml'

jobs:
  phone-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out game development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >mobile-layout-http.log 2>&1 &
          echo $! > mobile-layout-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/tools/editor/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat mobile-layout-http.log
          exit 1

      - name: Verify phone viewport reachability
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const pages = [
            'index.html',
            'map-manager.html',
            'database.html',
            'items.html',
            'audio.html',
            'battle-test.html',
            'common-events.html',
            'project-search.html',
            'tile-passability.html'
          ];
          const viewports = [
            { width: 360, height: 800, label: '360x800 narrow Android' },
            { width: 412, height: 915, label: '412x915 Moto-class CSS viewport' }
          ];

          for (const viewport of viewports) {
            const page = await browser.newPage({
              viewport: { width: viewport.width, height: viewport.height },
              isMobile: true,
              hasTouch: true
            });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));

            for (const path of pages) {
              await page.goto(`http://127.0.0.1:4173/tools/editor/${path}`, { waitUntil: 'networkidle' });
              const metrics = await page.evaluate(() => ({
                innerWidth: window.innerWidth,
                htmlClientWidth: document.documentElement.clientWidth,
                htmlScrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth
              }));
              assert.ok(
                metrics.htmlScrollWidth <= metrics.innerWidth + 1,
                `${path} overflows the phone viewport at ${viewport.label}: html scroll ${metrics.htmlScrollWidth}, viewport ${metrics.innerWidth}`
              );
              assert.ok(
                metrics.bodyScrollWidth <= metrics.innerWidth + 1,
                `${path} body overflows the phone viewport at ${viewport.label}: body scroll ${metrics.bodyScrollWidth}, viewport ${metrics.innerWidth}`
              );

              const topbar = page.locator('.topbar');
              if (await topbar.count()) {
                const box = await topbar.boundingBox();
                assert.ok(box && box.x >= -1 && box.x + box.width <= viewport.width + 1, `${path} topbar is outside viewport`);
              }
            }

            await page.goto('http://127.0.0.1:4173/tools/editor/index.html', { waitUntil: 'networkidle' });
            await page.click('#loadElyndor');
            await page.waitForFunction(() => document.querySelectorAll('.event-marker').length >= 4);

            const editorLayout = await page.evaluate(() => {
              const left = document.querySelector('.sidebar.left').getBoundingClientRect();
              const right = document.querySelector('.sidebar.right').getBoundingClientRect();
              const canvas = document.querySelector('.canvas-wrap').getBoundingClientRect();
              const actions = document.querySelector('.actions');
              const actionStyle = getComputedStyle(actions);
              return {
                left: { x: left.x, width: left.width },
                right: { x: right.x, width: right.width, position: getComputedStyle(document.querySelector('.sidebar.right')).position },
                canvas: { x: canvas.x, width: canvas.width },
                actionsOverflowX: actionStyle.overflowX
              };
            });

            for (const [name, rect] of Object.entries({ left: editorLayout.left, right: editorLayout.right, canvas: editorLayout.canvas })) {
              assert.ok(rect.x >= -1, `${name} begins off-screen at ${viewport.label}`);
              assert.ok(rect.x + rect.width <= viewport.width + 1, `${name} extends off-screen at ${viewport.label}`);
            }
            assert.equal(editorLayout.right.position, 'static', `right inspector must remain in normal touch flow at ${viewport.label}`);
            assert.match(editorLayout.actionsOverflowX, /auto|scroll/, `top actions must be swipeable at ${viewport.label}`);

            const touchTargets = await page.locator('.sidebar button:visible, .sidebar input:visible, .sidebar select:visible, .actions button:visible, .actions .button:visible').evaluateAll(nodes => nodes.map(node => {
              const r = node.getBoundingClientRect();
              return { text: node.textContent?.trim() || node.id || node.tagName, width: r.width, height: r.height };
            }));
            const tooShort = touchTargets.filter(target => target.height > 0 && target.height < 43);
            assert.deepEqual(tooShort, [], `undersized touch targets at ${viewport.label}: ${JSON.stringify(tooShort)}`);
            assert.deepEqual(errors, [], `page errors at ${viewport.label}: ${errors.join('\n')}`);
            await page.close();
          }

          await browser.close();
          console.log('Plushbound phone viewport layout gate passed');
          NODE

      - name: Upload mobile layout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-mobile-layout-ci
          path: mobile-layout-http.log
          if-no-files-found: warn
