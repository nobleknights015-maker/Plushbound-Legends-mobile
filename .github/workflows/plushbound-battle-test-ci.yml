name: Plushbound Battle Test CI

on:
  push:
    branches: [plushbound-game-development]
    paths:
      - 'tools/editor/battle-test.html'
      - 'tools/editor/battle-test.css'
      - 'tools/editor/battle-test.js'
      - 'tools/editor/battle-test-core.js'
      - 'game/tests/battle-test-core.test.js'
      - 'game/tests/boss-encounter-runtime.test.js'
      - 'game/runtime/**'
      - 'game/content/**'
      - 'engine/src/encounters/**'
      - '.github/workflows/plushbound-battle-test-ci.yml'
  workflow_dispatch:

jobs:
  battle-test-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run battle test contracts
        run: |
          node --check tools/editor/battle-test-core.js
          node --check tools/editor/battle-test.js
          node --test game/tests/battle-test-core.test.js game/tests/boss-encounter-runtime.test.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >battle-test-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/tools/editor/battle-test.html >/dev/null && exit 0
            sleep 1
          done
          cat battle-test-http.log
          exit 1
      - name: Simulate battle encounter testing on Android viewport
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:412,height:915}});
          const errors=[];page.on('pageerror',error=>errors.push(String(error)));
          await page.goto('http://127.0.0.1:4173/tools/editor/battle-test.html');
          await page.waitForFunction(()=>document.querySelector('#battleStatus')?.textContent==='Ready');
          assert.ok(await page.locator('#runtimePackage option').count()>=1);
          assert.ok(await page.locator('#battleMap option').count()>=2);
          assert.equal(await page.locator('#battleSeed').inputValue(),'1');
          await page.fill('#battleSeed','424242');
          await page.click('#applyBattleSeed');
          assert.match(await page.textContent('#battleStatus'),/seed 424242/i);
          assert.match(await page.textContent('#battleDiagnostics'),/"encounterSeed": 424242/);

          const boss=page.locator('#bossList [data-boss-id="verdancia-unraveled-hart"]');
          assert.ok(await boss.count());
          assert.equal(await boss.isDisabled(),false);
          await boss.click();
          assert.match(await page.locator('#activeEncounter').innerText(),/Unraveled Hart/i);
          assert.match(await page.locator('#activeEncounter').innerText(),/completion switch verdancia:unraveled-hart:defeated/i);
          assert.match(await page.textContent('#battleDiagnostics'),/"runtimePackage"/);
          assert.match(await page.textContent('#battleDiagnostics'),/"activeBoss": "verdancia-unraveled-hart"/);
          await page.click('#resolveEscape');
          assert.equal(await page.locator('#bossList [data-boss-id="verdancia-unraveled-hart"]').isDisabled(),false);
          await page.click('#bossList [data-boss-id="verdancia-unraveled-hart"]');
          await page.click('#resolveVictory');
          assert.equal(await page.locator('#bossList [data-boss-id="verdancia-unraveled-hart"]').isDisabled(),true);
          assert.match(await page.textContent('#battleStatus'),/marked complete/i);

          assert.ok(await page.locator('#battleMap option[value="elyndor-sunthread-crossing"]').count());
          const verdanciaRuntime=await page.locator('#runtimePackage').inputValue();
          await page.selectOption('#battleMap','elyndor-sunthread-crossing');
          await page.waitForFunction(()=>document.querySelector('#battleStatus')?.textContent.includes('switched runtime package'));
          assert.notEqual(await page.locator('#runtimePackage').inputValue(),verdanciaRuntime);
          assert.equal(await page.locator('#battleMap').inputValue(),'elyndor-sunthread-crossing');
          assert.match(await page.textContent('#battleDiagnostics'),/"map": "elyndor-sunthread-crossing"/);
          assert.equal(await page.locator('#bossList [data-boss-id="verdancia-unraveled-hart"]').isDisabled(),true);
          await page.fill('#battleRegion','0');
          await page.waitForFunction(()=>document.querySelectorAll('#encounterCandidates [data-enemy-id]').length>0);
          const candidateIds=await page.locator('#encounterCandidates [data-enemy-id]').evaluateAll(nodes=>nodes.map(node=>node.dataset.enemyId));
          assert.ok(candidateIds.includes('frayling-knotling'));
          await page.click('#encounterCandidates [data-enemy-id="frayling-knotling"]');
          assert.equal(await page.locator('#resolveVictory').isDisabled(),false);
          assert.match(await page.locator('#activeEncounter').innerText(),/Knotling|frayling-knotling/i);
          await page.selectOption('#battleQuest','threads-out-of-tune');
          await page.click('#prepareQuest');
          await page.waitForFunction(()=>document.querySelector('#questProgress')?.textContent.includes('defeat-crossing-fraylings'));
          const before=await page.locator('#questProgress').innerText();
          assert.match(before,/0\/3/);
          await page.click('#resolveVictory');
          const after=await page.locator('#questProgress').innerText();
          assert.match(after,/1\/3/);
          assert.deepEqual(errors,[]);
          await browser.close();
          console.log('Android battle encounter + boss lifecycle + automatic cross-package map + persistent sandbox state simulation passed');
          NODE
