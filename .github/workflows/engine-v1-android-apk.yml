name: Plushbound Engine v1 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ engine-v1-rebuild ]
    paths:
      - 'engine/**'
      - 'source_chunks/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/engine-v1-android-apk.yml'

jobs:
  build-engine-v1-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine rebuild
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Engine v1 tests
        working-directory: engine
        run: npm test

      - name: Run final release acceptance gate explicitly
        working-directory: engine
        run: node --test tests/final_acceptance_gate.test.js

      - name: Run Engine v1 freeze readiness gate explicitly
        working-directory: engine
        run: node --test tests/freeze_readiness_gate.test.js

      - name: Record tested release-gate commit
        run: |
          cat > engine-v1-release-gate.json <<JSON
          {
            "engine": "Plushbound Engine v1",
            "branch": "engine-v1-rebuild",
            "commit": "${GITHUB_SHA}",
            "acceptanceTest": "engine/tests/final_acceptance_gate.test.js",
            "freezeTest": "engine/tests/freeze_readiness_gate.test.js",
            "status": "passed"
          }
          JSON
          python -m json.tool engine-v1-release-gate.json >/dev/null

      - name: Reconstruct clean Android project source
        run: |
          cat source_chunks/part_* > project-source.b64
          base64 -d project-source.b64 > project-source-fixed.zip
          unzip -o project-source-fixed.zip -d .

      - name: Apply native-feel fixed viewport shell policy
        run: |
          python - <<'PY'
          from pathlib import Path
          css_files = sorted(Path('app/src/main/assets').rglob('style.css'))
          if not css_files:
              raise SystemExit('No shell stylesheet found under app/src/main/assets')
          native_css = r'''

/* Plushbound Engine v1 native-surface policy: no document or panel scrolling. */
html,body,#app{
  position:fixed!important;inset:0!important;width:100%!important;height:100%!important;
  overflow:hidden!important;overscroll-behavior:none!important;touch-action:none!important;
}
.screen,.overlay{overflow:hidden!important;min-width:0!important;min-height:0!important}
.panel{
  overflow:hidden!important;
  max-height:calc(100dvh - 16px)!important;
  max-width:calc(100dvw - 16px)!important;
}
#creatorScreen .panel,#starterScreen .panel,#mapScreen .panel,#menuScreen .panel,#creditsScreen .panel{
  height:min(680px,calc(100dvh - 16px));
  display:flex;flex-direction:column;min-height:0;
}
#creatorScreen .creator-grid{flex:1;min-height:0;overflow:hidden;grid-template-columns:minmax(180px,30%) 1fr}
#creatorScreen .avatar-preview{min-height:0;height:100%}
#creatorScreen .creator-form{min-height:0;align-content:center}
#starterScreen .starter-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-height:0}
#starterScreen .starter-card{min-height:0;padding:10px}
#starterScreen .starter-icon{font-size:34px;margin-bottom:4px}
#starterScreen .starter-stat{margin-top:6px}
#starterScreen .starter-detail{margin-top:8px;padding:10px;line-height:1.25}
#starterScreen .row-actions{margin-top:8px}
#mapScreen .world-map{flex:1;min-height:220px;height:auto}
#mapScreen .map-info{flex:0 0 auto}
#menuScreen .menu-grid{flex:1;min-height:0;align-content:center}
#menuScreen .info-card{min-height:0}
#creditsScreen .credits-copy{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:18px;row-gap:4px;align-content:center;font-size:13px;line-height:1.35;
}
#creditsScreen .credits-copy h3,#creditsScreen .credits-copy p{margin:0}
@media (max-height:600px){
  .screen,.overlay{padding:8px!important}.panel{padding:12px!important}
  .section-heading{margin-bottom:8px!important}.section-heading h2{font-size:22px!important}
  .eyebrow{margin-bottom:3px!important}
  button{min-height:38px!important;padding:7px 12px!important}
  #starterScreen .muted{margin:4px 0 6px!important;font-size:12px}
  #starterScreen .starter-card small{font-size:11px}
  #starterScreen .starter-pick{margin-top:5px}
  #mapScreen .world-map{min-height:180px}
}
'''
          for css in css_files:
              text = css.read_text(encoding='utf-8')
              marker = 'Plushbound Engine v1 native-surface policy'
              if marker not in text:
                  css.write_text(text + native_css, encoding='utf-8')
          print(f'Applied native viewport policy to {len(css_files)} stylesheet(s).')
          PY
          grep -R -q 'Plushbound Engine v1 native-surface policy' app/src/main/assets --include='style.css'

      - name: Package Engine v1 modules into Android assets
        run: |
          rm -rf app/src/main/assets/engine-v1
          mkdir -p app/src/main/assets/engine-v1/content
          cp -R engine/src/. app/src/main/assets/engine-v1/
          cp engine/content/asset-manifest.json app/src/main/assets/engine-v1/content/asset-manifest.json
          cp engine-v1-release-gate.json app/src/main/assets/engine-v1/release-gate.json
          cat > app/src/main/assets/engine-v1/package-manifest.json <<'JSON'
          {
            "engine": "Plushbound Engine v1",
            "branch": "engine-v1-rebuild",
            "entrypoints": {
              "kernel": "core/EngineKernel.js",
              "androidHost": "platform/AndroidHostBridge.js",
              "webViewRuntime": "runtime/BrowserRuntimeEntry.js"
            },
            "contentManifest": "content/asset-manifest.json",
            "releaseGate": "release-gate.json"
          }
          JSON

      - name: Inject Engine v1 runtime into reconstructed WebView shell
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path('app/src/main/assets')
          target = root / 'engine-v1/runtime/BrowserRuntimeEntry.js'
          manifest = root / 'engine-v1/content/asset-manifest.json'
          html_files = sorted(root.rglob('*.html'))
          if not html_files:
              raise SystemExit('No Android WebView HTML entrypoint found under app/src/main/assets')
          marker = 'data-plushbound-engine-v1="runtime"'
          injected = 0
          for html in html_files:
              text = html.read_text(encoding='utf-8')
              runtime_rel = Path(os.path.relpath(target, html.parent)).as_posix()
              manifest_rel = Path(os.path.relpath(manifest, html.parent)).as_posix()
              if marker in text:
                  text = text.replace(marker, f'{marker} data-asset-manifest="{manifest_rel}"', 1) if 'data-asset-manifest=' not in text else text
              else:
                  tag = f'<script type="module" src="{runtime_rel}" {marker} data-asset-manifest="{manifest_rel}"></script>'
                  if '</body>' in text:
                      text = text.replace('</body>', tag + '\n</body>', 1)
                  else:
                      text += '\n' + tag + '\n'
              html.write_text(text, encoding='utf-8')
              injected += 1
          print(f'Injected Engine v1 runtime into {injected} HTML file(s).')
          PY
          grep -R -q 'data-plushbound-engine-v1="runtime"' app/src/main/assets --include='*.html'
          grep -R -q 'data-asset-manifest=' app/src/main/assets --include='*.html'

      - name: Validate packaged Engine v1 modules
        run: |
          test -f app/src/main/assets/engine-v1/core/EngineKernel.js
          test -f app/src/main/assets/engine-v1/platform/AndroidHostBridge.js
          test -f app/src/main/assets/engine-v1/platform/PerformanceBudget.js
          test -f app/src/main/assets/engine-v1/runtime/BrowserRuntimeEntry.js
          test -f app/src/main/assets/engine-v1/content/asset-manifest.json
          test -f app/src/main/assets/engine-v1/release-gate.json
          grep -q "${GITHUB_SHA}" app/src/main/assets/engine-v1/release-gate.json
          grep -q 'freeze_readiness_gate.test.js' app/src/main/assets/engine-v1/release-gate.json
          grep -R -q 'engine-v1/runtime/BrowserRuntimeEntry.js' app/src/main/assets --include='*.html'
          grep -R -q 'engine-v1/content/asset-manifest.json' app/src/main/assets --include='*.html'
          grep -R -q 'Plushbound Engine v1 native-surface policy' app/src/main/assets --include='style.css'
          find app/src/main/assets/engine-v1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool app/src/main/assets/engine-v1/package-manifest.json >/dev/null
          python -m json.tool app/src/main/assets/engine-v1/content/asset-manifest.json >/dev/null
          python -m json.tool app/src/main/assets/engine-v1/release-gate.json >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build clean Engine v1 debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and embedded engine payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/engine-v1/core/EngineKernel.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/platform/AndroidHostBridge.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/platform/PerformanceBudget.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/runtime/BrowserRuntimeEntry.js'
          unzip -l "$APK" | grep -q 'assets/engine-v1/content/asset-manifest.json'
          unzip -l "$APK" | grep -q 'assets/engine-v1/package-manifest.json'
          unzip -l "$APK" | grep -q 'assets/engine-v1/release-gate.json'
          unzip -p "$APK" assets/engine-v1/release-gate.json | grep -q "${GITHUB_SHA}"
          unzip -p "$APK" assets/engine-v1/release-gate.json | grep -q 'freeze_readiness_gate.test.js'
          HTML=$(unzip -Z1 "$APK" | grep '^assets/.*\.html$' | head -n 1)
          CSS=$(unzip -Z1 "$APK" | grep '^assets/.*style\.css$' | head -n 1)
          test -n "$HTML"
          test -n "$CSS"
          unzip -p "$APK" "$HTML" | grep -q 'data-plushbound-engine-v1="runtime"'
          unzip -p "$APK" "$HTML" | grep -q 'engine-v1/runtime/BrowserRuntimeEntry.js'
          unzip -p "$APK" "$HTML" | grep -q 'data-asset-manifest='
          unzip -p "$APK" "$CSS" | grep -q 'Plushbound Engine v1 native-surface policy'
          unzip -p "$APK" "$CSS" | grep -q 'overflow:hidden!important'

      - name: Verify Android installability metadata
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.plushbound.legends'" apk-badging.txt
          grep -q "targetSdkVersion:'35'" apk-badging.txt
          aapt dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo 'Engine v1 APK must remain offline and must not request INTERNET permission.' >&2
            exit 1
          fi
          apksigner verify --verbose --print-certs "$APK"
          zipalign -c -v 4 "$APK"

      - name: Record APK checksum
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee engine-v1-apk.sha256

      - name: Upload Engine v1 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-engine-v1-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            engine-v1-apk.sha256
            engine-v1-release-gate.json
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: error
